<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Reaction Dynamics</title>
  <desc id="desc">Reaction timing is transformed into four behavioral shapes and practical team clarity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1021"/>
      <stop offset="0.55" stop-color="#11152b"/>
      <stop offset="1" stop-color="#19102b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b7cff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { fill: #9098b5; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
      .card-title { fill: #f7f8ff; font-size: 17px; font-weight: 700; }
      .card-copy { fill: #9da5c2; font-size: 12px; }
      .axis { stroke: #343b5a; stroke-width: 2; stroke-linecap: round; }
      .stem { stroke: #515a80; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="170" r="330" fill="url(#glow)"/>
  <circle cx="125" cy="560" r="250" fill="#24d6b0" opacity=".035"/>

  <g class="sans">
    <g transform="translate(62 55)">
      <rect width="46" height="46" rx="14" fill="#8b7cff"/>
      <circle cx="15" cy="16" r="4" fill="#fff"/>
      <circle cx="30" cy="16" r="4" fill="#fff" opacity=".7"/>
      <circle cx="15" cy="30" r="4" fill="#fff" opacity=".7"/>
      <circle cx="30" cy="30" r="4" fill="#fff"/>
    </g>
    <text x="126" y="76" class="label">REACTION DYNAMICS</text>

    <text x="62" y="160" fill="#f8f9ff" font-size="55" font-weight="760" letter-spacing="-2.2">The reaction is visible.</text>
    <text x="62" y="218" fill="#b7bed8" font-size="55" font-weight="650" letter-spacing="-2.2">The meaning is in the timing.</text>
    <text x="64" y="260" fill="#9098b5" font-size="19">Turn Slack reaction patterns into clearer ownership, healthier decisions, and fewer dropped asks.</text>

    <g filter="url(#shadow)">
      <rect x="62" y="306" width="252" height="202" rx="18" fill="#151a31" stroke="#2d3556"/>
      <rect x="328" y="306" width="252" height="202" rx="18" fill="#151a31" stroke="#2d3556"/>
      <rect x="594" y="306" width="252" height="202" rx="18" fill="#151a31" stroke="#2d3556"/>
      <rect x="860" y="306" width="278" height="202" rx="18" fill="#151a31" stroke="#2d3556"/>
    </g>

    <g transform="translate(84 330)">
      <text class="card-title">Cascade</text>
      <text y="24" class="card-copy">A fast burst after the first move</text>
      <line x1="0" y1="110" x2="208" y2="110" class="axis"/>
      <g fill="#ff7a59">
        <circle cx="18" cy="94" r="7"/><circle cx="32" cy="78" r="7"/><circle cx="44" cy="96" r="7"/>
        <circle cx="58" cy="72" r="7"/><circle cx="72" cy="90" r="7"/><circle cx="88" cy="80" r="7"/>
      </g>
      <text y="154" class="mono" fill="#ff9a7e" font-size="12">social proof?</text>
    </g>

    <g transform="translate(350 330)">
      <text class="card-title">Trickle</text>
      <text y="24" class="card-copy">Even, independent arrivals</text>
      <line x1="0" y1="110" x2="208" y2="110" class="axis"/>
      <g fill="#4de8c2">
        <circle cx="15" cy="91" r="7"/><circle cx="52" cy="77" r="7"/><circle cx="90" cy="94" r="7"/>
        <circle cx="129" cy="73" r="7"/><circle cx="168" cy="90" r="7"/><circle cx="204" cy="80" r="7"/>
      </g>
      <text y="154" class="mono" fill="#72f0d1" font-size="12">independent agreement</text>
    </g>

    <g transform="translate(616 330)">
      <text class="card-title">Stall → burst</text>
      <text y="24" class="card-copy">Silence, then the room moves</text>
      <line x1="0" y1="110" x2="208" y2="110" class="axis"/>
      <g fill="#f4c95d">
        <circle cx="128" cy="92" r="7"/><circle cx="144" cy="74" r="7"/><circle cx="158" cy="96" r="7"/>
        <circle cx="173" cy="77" r="7"/><circle cx="188" cy="91" r="7"/><circle cx="202" cy="72" r="7"/>
      </g>
      <text y="154" class="mono" fill="#f7d985" font-size="12">deference?</text>
    </g>

    <g transform="translate(882 330)">
      <text class="card-title">Split</text>
      <text y="24" class="card-copy">Opposed reactions share the room</text>
      <line x1="0" y1="110" x2="234" y2="110" class="axis"/>
      <g fill="#8b7cff">
        <circle cx="24" cy="80" r="8"/><circle cx="64" cy="92" r="8"/><circle cx="106" cy="76" r="8"/>
        <circle cx="148" cy="92" r="8"/>
      </g>
      <g fill="#ff6e91">
        <circle cx="44" cy="123" r="8"/><circle cx="85" cy="125" r="8"/><circle cx="127" cy="121" r="8"/>
        <circle cx="170" cy="124" r="8"/>
      </g>
      <text y="154" class="mono" fill="#b4aaff" font-size="12">disagreement counts hide</text>
    </g>

    <g transform="translate(64 560)">
      <circle cx="8" cy="-5" r="5" fill="#ff7a59"/>
      <text x="24" fill="#aeb5d0" font-size="14">live Slack events</text>
      <path d="M164 -5 H224" stroke="#465071" stroke-width="2" stroke-dasharray="4 5"/>
      <circle cx="242" cy="-5" r="5" fill="#4de8c2"/>
      <text x="258" fill="#aeb5d0" font-size="14">behavioral shapes</text>
      <path d="M401 -5 H461" stroke="#465071" stroke-width="2" stroke-dasharray="4 5"/>
      <circle cx="479" cy="-5" r="5" fill="#8b7cff"/>
      <text x="495" fill="#aeb5d0" font-size="14">Cognee + Qdrant graph</text>
      <path d="M681 -5 H741" stroke="#465071" stroke-width="2" stroke-dasharray="4 5"/>
      <circle cx="759" cy="-5" r="5" fill="#f4c95d"/>
      <text x="775" fill="#f7f8ff" font-size="14" font-weight="700">better follow-through</text>
    </g>

    <text x="64" y="608" fill="#68718f" font-size="12" letter-spacing="1">BEHAVIOR, NOT MIND-READING  ·  A TRANSLATOR, NOT A MONITOR</text>
  </g>
</svg>
